name: CI Quality Gate & Automated Test Suite

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Build & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Code Quality & Lint
        run: yarn lint

      - name: TypeScript Compiler Verification
        run: yarn tsc --noEmit

      - name: Next.js Production Build
        run: yarn build
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: 'sage-production'
          RESEND_API_KEY: 're_test_key_for_ci_build'

      # E2E Tests temporarily paused for faster CI iteration
